name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: redis
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y google-chrome-stable curl libjemalloc2 libvips postgresql-client

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # ローカルでは bin/dev / yarn build が app/assets/builds/ を生成しているが、
      # CI ではビルド成果物が .gitignore で除外されているため明示的にビルドする。
      # これを行わないと stylesheet_link_tag "tailwind" が
      # 代替で application.tailwind.css (SCSS) を読み込み、
      # dartsass-sprockets が Tailwind 出力を SCSS として parse して失敗する。
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Node dependencies
        run: npm install

      # stylesheet_link_tag "tailwind" は app/assets/builds/tailwind.css を読み込む。
      # この成果物は tailwindcss-rails gem 提供の tailwindcss:build タスクで生成され、
      # npm run build:css (出力先: application.css) とは別物のため両方走らせる必要がある。
      - name: Build assets
        env:
          RAILS_ENV: test
        run: |
          bin/rails tailwindcss:build
          npm run build:css
          npm run build

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test test:system

      # ===== 診断ステップ (CI で Sass エラーが起きる原因を特定する用) =====
      - name: Diagnose - filesystem
        if: always()
        run: |
          echo "=== app/assets/builds/ ==="
          ls -la app/assets/builds/ || true
          echo ""
          echo "=== app/assets/stylesheets/ ==="
          ls -la app/assets/stylesheets/ || true
          echo ""
          echo "=== built tailwind.css head ==="
          head -c 300 app/assets/builds/tailwind.css || true
          echo ""
          echo "=== built application.css head ==="
          head -c 300 app/assets/builds/application.css || true

      - name: Diagnose - sprockets resolution
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: |
          bundle exec rails runner '
            puts "=== assets.paths ==="
            Rails.application.config.assets.paths.each { |p| puts p }
            puts ""
            puts "=== Sprockets resolve tailwind ==="
            puts Rails.application.assets.resolve("tailwind").to_s
            puts ""
            puts "=== Sprockets resolve application ==="
            puts Rails.application.assets.resolve("application").to_s
            puts ""
            puts "=== Find asset tailwind processors ==="
            asset = Rails.application.assets.find_asset("tailwind")
            puts "pathname:    #{asset&.pathname}"
            puts "content_type: #{asset&.content_type}"
            puts "first 300 chars of source:"
            puts asset&.source&.byteslice(0, 300)
          '

      - name: Run RSpec
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bundle exec rspec

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/.last_run.json ]; then
            LINE=$(ruby -rjson -e 'puts JSON.parse(File.read("coverage/.last_run.json")).dig("result","line")')
            BRANCH=$(ruby -rjson -e 'puts JSON.parse(File.read("coverage/.last_run.json")).dig("result","branch")')
            {
              echo "## Coverage"
              echo ""
              echo "| Metric | Coverage |"
              echo "| --- | --- |"
              echo "| Line   | ${LINE}% |"
              echo "| Branch | ${BRANCH}% |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "coverage/.last_run.json not found — RSpec may have failed before SimpleCov could finalize." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
